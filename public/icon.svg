<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#070B19"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3A86FF"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A86FF" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#EAB308" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#3A86FF" stroke-opacity="0.25" stroke-width="2"/>
  
  <!-- Glow Behind Cross -->
  <circle cx="256" cy="236" r="180" fill="url(#glow)"/>

  <!-- Halo Ring -->
  <circle cx="256" cy="180" r="64" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.85" filter="url(#dropShadow)"/>

  <!-- Cross Vertical Beam -->
  <path d="M 238 90 L 274 90 C 278 90 282 94 282 98 L 282 370 C 282 374 278 378 274 378 L 238 378 C 234 378 230 374 230 370 L 230 98 C 230 94 234 90 238 90 Z" fill="url(#goldGrad)" filter="url(#dropShadow)"/>

  <!-- Cross Horizontal Beam -->
  <path d="M 140 188 L 372 188 C 376 188 380 192 380 196 L 380 232 C 380 236 376 240 372 240 L 140 240 C 136 240 132 236 132 232 L 132 196 C 132 192 136 188 140 188 Z" fill="url(#goldGrad)" filter="url(#dropShadow)"/>

  <!-- Center Diamond Spark / Flame Accent -->
  <polygon points="256,170 290,214 256,258 222,214" fill="url(#blueGrad)"/>
  <circle cx="256" cy="214" r="7" fill="#FFFFFF"/>

  <!-- Bottom Brand Text Monogram -->
  <text x="256" y="440" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="4">SPIRIT OF FAITH</text>
  <text x="256" y="470" text-anchor="middle" fill="#3A86FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="6">BROADCAST PORTAL</text>
</svg>
